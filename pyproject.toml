[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fridapilot"
version = "0.1.0"
description = "AI Agent for Frida automation & dynamic instrumentation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "frida>=16.0.0",
    "frida-tools>=12.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "pefile>=2023.2.7",
    "pyelftools>=0.29",
    "capstone>=5.0.0",
]

[project.optional-dependencies]
agent = [
    "litellm>=1.0.0",
    "sqlmodel>=0.0.14",
]
mcp = [
    # The server uses the 2.x MCPServer API (@mcp.tool() with schemas derived from
    # the function signature). 1.x had the low-level @server.list_tools() decorators.
    "mcp>=2.0.0",
]


dev = [
    "pytest>=7.0.0",
    # Upper bound on purpose: ruff's DEFAULT rule set changes between releases, so an
    # unpinned linter turns CI red without a single line of code changing. The explicit
    # [tool.ruff.lint] select below is the real defence; this keeps the surprise small.
    "ruff>=0.4.0,<0.17",
]

[project.scripts]
fp = "fridapilot.cli.main:run_cli"
frida-pilot = "fridapilot.cli.main:run_cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Spelled out rather than inherited: CI installs ruff fresh, and a release that widens
# the defaults would otherwise "find" hundreds of new errors in unchanged code. That
# already happened - a newer ruff added I/UP/RUF to its defaults and reported 178
# errors, 102 of which were RUF001-003 complaining about the full-width punctuation in
# this project's Chinese docstrings and comments. That punctuation is intentional, so
# those rules are not part of this project's standard.
#   E4/E7/E9 + F  what ruff has enforced here all along (real errors, not style)
#   I             import order, because it is deterministic and auto-fixable
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# main.py builds the Typer app first, then imports and registers every
# subcommand - the imports cannot move above the app definition.
"fridapilot/cli/main.py" = ["E402"]


[tool.pytest.ini_options]
testpaths = ["tests"]

