[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fridapilot"
version = "0.1.0"
description = "AI Agent for Frida automation & dynamic instrumentation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "frida>=16.0.0",
    "frida-tools>=12.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "pefile>=2023.2.7",
    "pyelftools>=0.29",
    "capstone>=5.0.0",
]

[project.optional-dependencies]
agent = [
    "litellm>=1.0.0",
    "sqlmodel>=0.0.14",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
fp = "fridapilot.cli.main:app"
frida-pilot = "fridapilot.cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

